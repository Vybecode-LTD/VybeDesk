# STAGE 2 of the SOFTWARE_RELEASE.md pipeline — the SINGLE release creator.
#
# Fires when scripts/Invoke-Release.ps1 (Stage 1) pushes a new installer to
# releases/latest/. Extracts the version from the installer filename, skips if
# the release already exists (idempotent), malware-scans via VirusTotal (no-ops
# until the VT_API_KEY repo secret is set), then creates the GitHub Release with
# the version's CHANGELOG section + a download/scan footer, marked --latest.
#
# The local script must NEVER run `gh release create` (Core Rule #1) — this
# workflow is the only thing that does.
name: Auto-create release from installer

on:
  push:
    branches: [main]
    paths:
      - 'releases/latest/*.exe'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find installer and extract version
        id: info
        run: |
          EXE=$(ls releases/latest/*.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "No installer found in releases/latest/"
            exit 1
          fi
          FILENAME=$(basename "$EXE")
          VERSION=$(echo "$FILENAME" | grep -oP '\d+\.\d+\.\d+')
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from $FILENAME"
            exit 1
          fi
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          TAG="${{ steps.info.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog section
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          VERSION="${{ steps.info.outputs.version }}"
          SECTION=$(awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, ver)) found=1 }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            SECTION="Release v$VERSION"
          fi
          echo "$SECTION" > /tmp/release_notes.md

      - name: VirusTotal scan
        if: steps.check.outputs.exists == 'false'
        id: vtscan
        run: |
          EXE="${{ steps.info.outputs.exe }}"
          VT_KEY="${{ secrets.VT_API_KEY }}"
          if [ -z "$VT_KEY" ]; then
            echo "VT_API_KEY not set — skipping malware scan."
            echo "vt_url=" >> "$GITHUB_OUTPUT"
            echo "sha256=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Large files (>32MB) need the dedicated upload URL endpoint.
          UPLOAD_URL=$(curl -s --request GET \
            --url https://www.virustotal.com/api/v3/files/upload_url \
            --header "x-apikey: $VT_KEY" | jq -r '.data // empty')
          if [ -z "$UPLOAD_URL" ]; then
            UPLOAD_URL="https://www.virustotal.com/api/v3/files"
          fi
          RESPONSE=$(curl -s --request POST \
            --url "$UPLOAD_URL" \
            --header "x-apikey: $VT_KEY" \
            --form "file=@$EXE")
          ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.data.id // empty')
          SHA256=$(sha256sum "$EXE" | cut -d' ' -f1)
          if [ -n "$ANALYSIS_ID" ]; then
            echo "vt_url=https://www.virustotal.com/gui/file/$SHA256" >> "$GITHUB_OUTPUT"
          else
            echo "vt_url=" >> "$GITHUB_OUTPUT"
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.info.outputs.tag }}"
          EXE="${{ steps.info.outputs.exe }}"
          VT_URL="${{ steps.vtscan.outputs.vt_url }}"
          SHA256="${{ steps.vtscan.outputs.sha256 }}"

          echo "" >> /tmp/release_notes.md
          echo "---" >> /tmp/release_notes.md
          echo "**Download:** ${{ steps.info.outputs.filename }}" >> /tmp/release_notes.md
          echo "**Platform:** Windows 10/11 (x64)" >> /tmp/release_notes.md
          if [ -n "$VT_URL" ]; then
            echo "**VirusTotal:** [$SHA256]($VT_URL)" >> /tmp/release_notes.md
          fi

          gh release create "$TAG" "$EXE" \
            --title "VybeDesk $TAG" \
            --notes-file /tmp/release_notes.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
